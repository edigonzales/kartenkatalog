catalog.xtf-location=${CATALOG_XTF_LOCATION:file:./data/kartenkatalog-harvest-ohne-qml.xtf}
quarkus.http.host=0.0.0.0
quarkus.http.test-port=0
quarkus.jackson.serialization-inclusion=always
# The catalog contract explicitly sorts with de-CH; native images must include its locale data.
quarkus.locales=de-CH,en-US
# Jsoup validates description hrefs via java.net.URL; retain HTTPS in native output too.
quarkus.native.enable-https-url-handler=true
