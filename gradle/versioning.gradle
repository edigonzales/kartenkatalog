// CI version is tied to this workflow run, never to Jenkins/Travis environment values.
def runNumber = providers.environmentVariable('GITHUB_RUN_NUMBER').orNull
if (runNumber != null && !(runNumber ==~ /[1-9][0-9]*/)) {
    throw new GradleException('GITHUB_RUN_NUMBER must be a positive integer')
}
version = "0.2.${runNumber ?: 'LOCALBUILD'}"

tasks.register('printVersion') {
    description = 'Print the application version used for packaging and image tags.'
    doLast { println project.version }
}
