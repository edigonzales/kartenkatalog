tasks.register('copyNativeImage', Copy) {
    dependsOn 'nativeCompile'
    from layout.buildDirectory.file('native/nativeCompile/kartenkatalog')
    into layout.projectDirectory.dir('docker/image/tmp')
}

// Building locally must not publish a registry image as a hidden side effect.
['buildNativeDockerImage': '--load', 'publishNativeDockerImage': '--push'].each { taskName, outputMode ->
    tasks.register(taskName, Exec) {
        dependsOn 'copyNativeImage'
        workingDir layout.projectDirectory.dir('docker/image')
        doFirst {
            def revision = providers.exec {
                commandLine 'git', 'rev-parse', 'HEAD'
            }.standardOutput.asText.get().trim()
            commandLine 'docker', 'buildx', 'build',
                    '--platform', 'linux/amd64',
                    '-t', "sogis/kartenkatalog:$version.major",
                    '-t', "sogis/kartenkatalog:$version.major.$version.minor",
                    '-t', "sogis/kartenkatalog:$version",
                    '-t', 'sogis/kartenkatalog:latest',
                    '--label', "kartenkatalog.git_commit=$revision",
                    '--label', "kartenkatalog.version=$version",
                    '-f', 'Dockerfile.native', '.', outputMode
        }
    }
}
