plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.18'
    id 'gg.jte.gradle' version '3.2.4'
}

apply from: "$rootDir/gradle/versioning.gradle"
apply from: "$rootDir/gradle/docker.gradle"

group = 'ch.so.agi'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'gg.jte:jte:3.2.4'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.4'
    implementation 'org.jsoup:jsoup:1.23.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.h2database:h2'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jte {
    generate() 
    binaryStaticContent = true
}

tasks.named('test') {
    useJUnitPlatform()
}

import org.springframework.boot.gradle.tasks.aot.ProcessAot
tasks.withType(ProcessAot) {
    args "--spring.profiles.active=${project.findProperty('aotProfiles') ?: 'default'}"
}

graalvmNative {
    toolchainDetection = false
    binaries {
        main {
            buildArgs.add('-march=compatibility')
            buildArgs.add("-J-Xmx${providers.gradleProperty('nativeMaxHeap').getOrElse('4g')}")
            buildArgs.add("--parallelism=${providers.gradleProperty('nativeParallelism').getOrElse('2')}")
            if (project.hasProperty('nativeQuickBuild')) buildArgs.add('-Ob')

            verbose = true
        }
    }
}
