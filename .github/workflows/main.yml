name: JVM checks
on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - '**.md'
jobs:
  jvm:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and package Quarkus JVM
        run: ./gradlew clean test quarkusBuild
      - name: Real JVM HTTP and startup contracts
        run: python3 scripts/p1-process-contract.py
      - name: Real RAM-index rebuild and search contracts
        run: python3 scripts/p2-process-contract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-reports
          path: |
            build/reports/
            build/test-results/
